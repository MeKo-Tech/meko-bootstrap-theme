name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted like deploy-cdn.yml, which runs the same npm build: the
    # ewws-arc-ci-onprem scale set does not serve this repository, so jobs
    # there sat queued until GitHub cancelled them after 24 h (every run
    # since 2025-09-29).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare demo for deployment
        run: |
          mkdir -p _site
          cp -r demo/* _site/
          cp -r dist _site/
          # Fix CSS path for GitHub Pages
          sed -i 's|../dist/bootstrap-meko.min.css|./dist/bootstrap-meko.min.css|g' _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
