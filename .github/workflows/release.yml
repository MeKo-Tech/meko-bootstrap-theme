name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: [ewws-arc-ci-onprem]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          release_name: Release v${{ steps.package-version.outputs.version }}
          body: |
            ## MeKo Bootstrap Theme v${{ steps.package-version.outputs.version }}

            ### Assets
            - `bootstrap-meko.min.css` - Minified CSS theme
            - `bootstrap-meko.css` - Unminified CSS theme
            - Fonts and assets included

            ### Usage
            ```html
            <link rel="stylesheet" href="https://github.com/MeKo-Tech/meko-bootstrap-theme/releases/download/v${{ steps.package-version.outputs.version }}/bootstrap-meko.min.css">
            ```
          draft: false
          prerelease: false

      - name: Create distribution archive
        run: |
          cd dist
          tar -czf ../meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.tar.gz *
          cd ..
          zip -r meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.zip dist/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.tar.gz
          asset_name: meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Assets (ZIP)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.zip
          asset_name: meko-bootstrap-theme-v${{ steps.package-version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload minified CSS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/bootstrap-meko.min.css
          asset_name: bootstrap-meko.min.css
          asset_content_type: text/css

      - name: Upload unminified CSS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/bootstrap-meko.css
          asset_name: bootstrap-meko.css
          asset_content_type: text/css
