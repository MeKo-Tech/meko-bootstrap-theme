name: Deploy to DigitalOcean Spaces CDN

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uploads queue instead of overlapping or cancelling each other, so a newer
# push never interrupts a running upload halfway through the bucket.
concurrency:
  group: deploy-meko-bootstrap-theme-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Runs queue now, so a hung upload must not block the group for
    # GitHub's 6 h default.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for CDN
        run: npm run build:cdn

      - name: Configure AWS CLI for DigitalOcean Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.DO_SPACES_REGION }}
        run: echo "AWS CLI configured via environment variables"

      - name: Deploy to DigitalOcean Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_DEFAULT_REGION: ${{ vars.DO_SPACES_REGION }}
        run: |
          aws s3 cp dist/ s3://${{ vars.DO_SPACES_BUCKET }}/meko-bootstrap-theme/ \
            --recursive \
            --endpoint-url=https://${{ vars.DO_SPACES_REGION }}.digitaloceanspaces.com \
            --cache-control "max-age=31536000, public" \
            --acl public-read

      - name: Show deployment info
        run: |
          echo "CDN deployed successfully!"
          echo "Theme available at: https://${{ vars.DO_SPACES_BUCKET }}.${{ vars.DO_SPACES_REGION }}.digitaloceanspaces.com/meko-bootstrap-theme/"
          echo "Minified CSS: https://${{ vars.DO_SPACES_BUCKET }}.${{ vars.DO_SPACES_REGION }}.digitaloceanspaces.com/meko-bootstrap-theme/bootstrap-meko.min.*.css"
